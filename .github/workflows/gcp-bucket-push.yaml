---
name: Push Artifacts to GCP Bucket

on:
  workflow_call:
    inputs:
      artifact-ids:
        description: The artifact ids from the upload-artifact job.
        required: true
        type: string

      bucket:
        description: The bucket to which the artifacts will be uploaded.
        required: true
        type: string
      path-prefix:
        description: The path to which the artifacts will be uploaded.
        required: false
        default: ${{ github.event.repository.name }}
        type: string

    secrets:
      GCP_SA_KEY:
        description: The GCP service account json.
        required: true

jobs:
  gcp-bucket-push:
    name: Push artifacts to GCP bucket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.artifact-ids }}
          path: artifacts

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Create GCS destination
        run: |
          [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]] && echo "SUBFOLDER=pull-requests/$(echo $GITHUB_REF | awk -F / '{print $3}')-${GITHUB_HEAD_REF##*/}" >> $GITHUB_ENV || true
          [[ "${GITHUB_EVENT_NAME}" == 'release' ]] && echo "SUBFOLDER=${GITHUB_REF##*/}" >> $GITHUB_ENV || true
          [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'branch' ]] && echo "SUBFOLDER=branch-${GITHUB_REF##*/}" >> $GITHUB_ENV || true

      - name: Upload artifacts
        run: |
          cd artifacts
          gcloud storage cp --cache-control=no-store --recursive . gs://${{ inputs.bucket }}/${{ inputs.path-prefix }}/${SUBFOLDER}/
