---
name: Go Build

on:
  workflow_call:
    inputs:
      lint:
        description: Runs a job to lint the go project.
        required: false
        default: true
        type: boolean
      test:
        description: Runs a job to test the go project.
        required: false
        default: true
        type: boolean
      build:
        description: Runs a job to build the go project and publish a Docker container.
        required: false
        default: true
        type: boolean
      push:
        description: Pushes the built container image and signs it. Set to false to only build the binary and upload artifacts.
        required: false
        default: true
        type: boolean

      build-command:
        description: The command used to build the Go binaries in case needed before building the container.
        required: false
        type: string
      test-command:
        description: The command used to test the Go repository.
        required: false
        default: go test ./... -coverprofile=coverage.out -covermode=atomic && go tool cover -func=coverage.out
        type: string

      registry:
        description: The registry to publish the container artifact to.
        default: ghcr.io
        required: false
        type: string
      registry-username:
        description: The registry username to login with.
        default: ${{ github.actor }}
        required: false
        type: string

      image-name:
        description: The resulting container image name.
        default: ${{ github.repository }}
        required: false
        type: string
      dockerfile:
        description: The dockerfile used for building the container.
        default: "./Dockerfile"
        required: false
        type: string
      context:
        description: The build context used for building the container.
        default: .
        required: false
        type: string

      runs-on:
        description: The runner on which this workflow is executed.
        default: ubuntu-latest
        required: false
        type: string

      artifact-files:
        description: Allows uploading artifacts in order to re-use them in subsequent jobs. You can pass a file pattern or directory here.
        required: false
        type: string
      artifact-name:
        description: The name of the uploaded build artifact.
        default: go-build-artifact
        required: false
        type: string

    secrets:
      COSIGN_PRIVATE_KEY:
        required: true
      COSIGN_PASSWORD:
        required: true
      DOCKER_REGISTRY_PASSWORD:
        description: The registry password to login with. Falls back to the GITHUB_TOKEN CI secret.
        required: false

    outputs:
        go-build-artifacts:
          description: The uploaded build artifacts in case artifact-files were provided.
          value: ${{ jobs.go-build.outputs.go-build-artifacts }}

jobs:
  go-lint:
    uses: ./.github/workflows/go-lint.yaml
    if: inputs.lint
    with:
      runs-on: ${{ inputs.runs-on }}

  go-test:
    uses: ./.github/workflows/go-test.yaml
    if: inputs.test
    with:
      test-command: ${{ inputs.test-command }}
      runs-on: ${{ inputs.runs-on }}

  go-build:
    uses: ./.github/workflows/go-compile.yaml
    if: inputs.build
    with:
      push: ${{ inputs.push }}
      build-command: ${{ inputs.build-command }}
      registry: ${{ inputs.registry }}
      registry-username: ${{ inputs.registry-username }}
      image-name: ${{ inputs.image-name }}
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.context }}
      runs-on: ${{ inputs.runs-on }}
      artifact-files: ${{ inputs.artifact-files }}
      artifact-name: ${{ inputs.artifact-name }}
    secrets: inherit
