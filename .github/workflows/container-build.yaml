---
name: Container Build

on:
  workflow_call:
    inputs:
      build-command:
        description: The command used to build the project in case needed before building the container.
        required: false
        type: string
      push:
        description: Pushes the built container image and signs it. Set to false to only build the binary and upload artifacts.
        required: false
        default: true
        type: boolean

      registry:
        description: The registry to publish the container artifact to.
        default: ghcr.io
        required: false
        type: string
      registry-username:
        description: The registry username to login with.
        default: ${{ github.actor }}
        required: false
        type: string

      image-name:
        description: The resulting container image name.
        default: ${{ github.repository }}
        required: false
        type: string
      dockerfile:
        description: The dockerfile used for building the container.
        default: "./Dockerfile"
        required: false
        type: string
      context:
        description: The build context used for building the container.
        default: .
        required: false
        type: string

      runs-on:
        description: The runner on which this workflow is executed.
        default: ubuntu-latest
        required: false
        type: string

      artifact-files:
        description: Allows uploading artifacts in order to re-use them in subsequent jobs. You can pass a file pattern or directory here.
        required: false
        type: string

    outputs:
        container-build-artifacts:
          description: The uploaded build artifacts in case artifact-files were provided.
          value: ${{ jobs.container-build.outputs.container-build-artifacts }}

    secrets:
      COSIGN_PRIVATE_KEY:
        required: true
      COSIGN_PASSWORD:
        required: true
      DOCKER_REGISTRY_PASSWORD:
        description: The registry password to login with. Falls back to the GITHUB_TOKEN CI secret.
        required: false

jobs:
  container-build:
    name: Container Build
    runs-on: ${{ inputs.runs-on }}
    outputs:
      container-build-artifacts: ${{ steps.artifact-upload-step.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: |
          ${{ inputs.build-command }}
        if: inputs.build-command != ''

      - name: Docker push and sign
        uses: $/.github/actions/docker-push-and-sign
        with:
          registry: ${{ inputs.registry }}
          registry-username: ${{ inputs.registry-username }}
          registry-password: ${{ secrets.DOCKER_REGISTRY_PASSWORD != '' && secrets.DOCKER_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
          cosign-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
          image-name: ${{ inputs.image-name }}
          dockerfile: ${{ inputs.dockerfile }}
          context: ${{ inputs.context }}
          sbom: true
        if: inputs.push

      - uses: actions/upload-artifact@v7
        id: artifact-upload-step
        with:
          name: container-build-artifact
          path: ${{ inputs.artifact-files }}
          if-no-files-found: error
          retention-days: 1
        if: inputs.artifact-files != ''
