---
name: metal-stack component release
on:
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  push:
    branches:
      - main

jobs:
  go-build:
    uses: ./.github/workflows/go-build.yaml
    secrets: inherit
    with:
      build-command: make go
      artifact-files: |
        bin/

  container-build:
    uses: ./.github/workflows/container-build.yaml
    secrets: inherit
    with:
      dockerfile: Dockerfile2
      build-command: |
        mkdir bin
        echo "an artifact" > bin/an-artifact
      artifact-files: |
        bin/

  spell-check:
    uses: ./.github/workflows/spell-check.yaml

  draft:
    uses: ./.github/workflows/release-drafter.yaml

  release-assets:
    uses: ./.github/workflows/release-assets.yaml
    needs:
      - go-build
      - container-build
    with:
      artifact-ids: ${{ needs.go-build.outputs.go-build-artifacts }},${{ needs.container-build.outputs.container-build-artifacts }}
      files: |
        ./container-build-artifact/*
        ./go-build-artifact/*

  helm-chart:
    uses: ./.github/workflows/helm-chart.yaml
    secrets: inherit
    with:
      chart-path: test-chart
      container-image-values-patch: a.b.image

  oci-ansible-role:
    uses: ./.github/workflows/oci-release-vector-artifact.yaml
    secrets: inherit
    with:
      artifact-type: ansible-role
      image-name: ${{ github.repository }}-ansible-role

  oci-release-vector:
    uses: ./.github/workflows/oci-release-vector-artifact.yaml
    secrets: inherit
    with:
      artifact-type: release-vector
      image-name: ${{ github.repository }}-release-vector
