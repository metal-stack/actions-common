---
name: metal-stack component release
on:
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  push:
    branches:
      - main

jobs:
  go-build:
    uses: ./.github/workflows/go-build.yaml
    secrets: inherit
    with:
      build-command: make go
      artifact-files: |
        bin/

  container-build:
    uses: ./.github/workflows/container-build.yaml
    secrets: inherit
    with:
      test: true
      test-command: echo "success"
      dockerfile: Dockerfile2
      build-command: |
        mkdir bin
        echo "an artifact" > bin/an-artifact
      artifact-files: |
        bin/

  spell-check:
    uses: ./.github/workflows/spell-check.yaml

  draft:
    uses: ./.github/workflows/release-drafter.yaml

  release-assets:
    uses: ./.github/workflows/release-assets.yaml
    needs:
      - go-build
      - container-build
    with:
      artifact-ids: ${{ needs.go-build.outputs.go-build-artifacts }},${{ needs.container-build.outputs.container-build-artifacts }}

  helm-chart:
    uses: ./.github/workflows/helm-chart.yaml
    secrets: inherit
    with:
      chart-path: test-chart
      container-image-values-patch: a.b.image
