---
name: Push Tags
description: Derives the tags from the triggering event.

inputs:
  default-branch-folder:
    description: The folder name to use for pushes to the default branch.
    required: false
    default: stable

outputs:
  container_tag:
    description: The resolved container image tag.
    value: ${{ steps.container_tag.outputs.container_tag }}
  helm_tag:
    description: The resolved helm chart tag.
    value: ${{ steps.helm_tag.outputs.helm_tag }}
  folder:
    description: The resolved destination folder.
    value: ${{ steps.folder.outputs.folder }}

runs:
  using: composite
  steps:
    - name: Make container tag
      id: container_tag
      shell: bash
      run: |
        [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]] && echo "container_tag=pr-$(echo $GITHUB_REF | awk -F / '{print $3}')-${GITHUB_HEAD_REF##*/}" | tee -a $GITHUB_OUTPUT || true
        [[ "${GITHUB_EVENT_NAME}" == 'release' ]] && echo "container_tag=${GITHUB_REF##*/}" | tee -a $GITHUB_OUTPUT || true
        [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'branch' ]] && echo "container_tag=branch-${GITHUB_REF##*/}" | tee -a $GITHUB_OUTPUT || true
        [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'tag' ]] && echo "container_tag=${GITHUB_REF##*/}" | tee -a $GITHUB_OUTPUT || true

    - name: Make helm tag
      id: helm_tag
      shell: bash
      run: |
        [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]] && echo "helm_tag=v0.0.0-pr.${{ github.event.number }}" | tee -a $GITHUB_OUTPUT || true
        [[ "${GITHUB_EVENT_NAME}" == 'release' ]] && echo "helm_tag=${GITHUB_REF##*/}" | tee -a $GITHUB_OUTPUT || true
        [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'branch' ]] && echo "helm_tag=v0.0.0-${GITHUB_REF##*/}" | tee -a $GITHUB_OUTPUT || true
        [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'tag' ]] && echo "helm_tag=${GITHUB_REF##*/}" | tee -a $GITHUB_OUTPUT || true

    - name: Make folder
      id: folder
      shell: bash
      run: |
        [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]] && echo "folder=pull-requests/$(echo $GITHUB_REF | awk -F / '{print $3}')-${GITHUB_HEAD_REF##*/}" | tee -a $GITHUB_OUTPUT || true
        [[ "${GITHUB_EVENT_NAME}" == 'release' ]] && echo "folder=${GITHUB_REF##*/}" | tee -a $GITHUB_OUTPUT || true
        [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'branch' && "${GITHUB_REF##*/}" == "${{ github.event.repository.default_branch }}" ]] && echo "folder=${{ inputs.default-branch-folder }}" | tee -a $GITHUB_OUTPUT || true
        [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'branch' && "${GITHUB_REF##*/}" != "${{ github.event.repository.default_branch }}" ]] && echo "folder=branch-${GITHUB_REF##*/}" | tee -a $GITHUB_OUTPUT || true
        [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'tag' ]] && echo "folder=${GITHUB_REF##*/}" | tee -a $GITHUB_OUTPUT || true
